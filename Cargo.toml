
[package]
name = "cargo-phoxal"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
publish = true
exclude = ["tests/"]
description = "The Phoxal project compiler and Cargo source-development command."
documentation = "https://github.com/phoxal/cargo#readme"
homepage = "https://github.com/phoxal/cargo"
repository = "https://github.com/phoxal/cargo"

[[bin]]
name = "cargo-phoxal"
path = "src/main.rs"

[dependencies]
humantime = "2.3.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
clap = { "version" = "4.6.1", "features" = ["derive", "env"] }
serde_json = { "version" = "1.0.149" }
cargo_metadata = { "version" = "0.23.1", "features" = ["builder"] }
fs4 = { "version" = "1.1.0" }
jsonschema = { "version" = "0.46.6", "default-features" = false }
object = { "version" = "0.36.7", "default-features" = false, "features" = ["std", "write_core", "read_core", "elf", "macho"] }
prost-reflect = { "version" = "0.16.5" }
prost = { "version" = "0.14.4" }
prost-types = { "version" = "0.14.4" }
serde = { "version" = "1.0.228", "features" = ["derive"] }
serde_yaml = { "version" = "0.9" }
sha2 = { "version" = "0.10.9" }
tempfile = { "version" = "3.27.0" }
thiserror = { "version" = "2.0.18" }
toml = { "version" = "1" }
phoxal = { "version" = "0.72.0", "default-features" = false, "features" = ["scenario"] }
phoxal-build = { "version" = "0.72.0" }

[lints]

[lints.rust]
unused = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

[features]
host-acceptance = []

[[test]]
name = "host_acquisition"
path = "tests/host_acquisition.rs"
required-features = ["host-acceptance"]
